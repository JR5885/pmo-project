<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Native Demand Forecasting & Capacity Planning Command Center</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border: 1px solid rgba(226, 232, 240, 0.8); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(241, 245, 249, 1); }
        ::-webkit-scrollbar-thumb { background: rgba(203, 213, 225, 1); border-radius: 3px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="p-2.5 bg-indigo-600 rounded-xl text-white shadow-lg shadow-indigo-500/30">
                    <i data-lucide="cpu" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base sm:text-lg text-slate-900 tracking-tight">AI-Native Demand & Capacity Command Center</h1>
                    <p class="text-xs text-slate-500">Singapore R&D Hub | Python, SQL & Claude Code Powered</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <div class="hidden md:flex items-center space-x-2 px-3 py-1.5 bg-emerald-50 border border-emerald-200 rounded-full text-emerald-700 text-xs font-medium">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span>資源配置準確度: 96.8%</span>
                </div>
                <button onclick="runAiSimulation()" class="inline-flex items-center space-x-2 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-medium rounded-xl shadow-sm transition-all transform active:scale-95">
                    <i data-lucide="sparkles" class="w-4 h-4"></i>
                    <span>執行 Python/SQL 模型模擬</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">

        <!-- KPI Grid -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
            <div class="glass-card p-6 rounded-2xl shadow-sm">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-500">資源配置準確度</span>
                    <span class="p-2 bg-emerald-50 text-emerald-600 rounded-xl"><i data-lucide="target" class="w-5 h-5"></i></span>
                </div>
                <div class="mt-4 flex items-baseline justify-between">
                    <div class="text-3xl font-bold text-slate-900 mono">96.8%</div>
                    <span class="text-xs font-semibold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full">+4.2% QoQ</span>
                </div>
                <p class="mt-2 text-xs text-slate-500">穩定維持在 95% 目標以上</p>
            </div>

            <div class="glass-card p-6 rounded-2xl shadow-sm">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-500">調度週期縮短</span>
                    <span class="p-2 bg-indigo-50 text-indigo-600 rounded-xl"><i data-lucide="zap" class="w-5 h-5"></i></span>
                </div>
                <div class="mt-4 flex items-baseline justify-between">
                    <div class="text-3xl font-bold text-slate-900 mono">40%</div>
                    <span class="text-xs font-semibold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full">Agility</span>
                </div>
                <p class="mt-2 text-xs text-slate-500">跨部門戰略決策與調度加速</p>
            </div>

            <div class="glass-card p-6 rounded-2xl shadow-sm">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-500">高價外包成本節省</span>
                    <span class="p-2 bg-amber-50 text-amber-600 rounded-xl"><i data-lucide="trending-down" class="w-5 h-5"></i></span>
                </div>
                <div class="mt-4 flex items-baseline justify-between">
                    <div class="text-3xl
